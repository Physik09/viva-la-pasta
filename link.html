<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viva la Pasta — Frisch. Schnell. Lecker.</title>
  <meta name="description" content="Viva la Pasta — Frische Pasta to-go in Aachen. Jetz bestellen, Speisekarte ansehen, Standort finden.">
  <meta name="theme-color" content="#7A1F2B">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="restaurant">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="Viva la Pasta — Frisch. Schnell. Lecker.">
  <meta property="og:description" content="Frische Pasta to-go in Aachen. Direkt bestellen über WhatsApp.">
  <meta property="og:image" content="https://www.vivalapasta.de/images/gallery-1.jpg">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237A1F2B'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23C9A96E' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

  <style>
    :root {
      --burgundy: #7A1F2B;
      --burgundy-light: #9A3544;
      --burgundy-dark: #5E1720;
      --burgundy-deep: #3E1019;
      --gold: #C9A96E;
      --gold-light: #D4BC8A;
      --gold-dark: #B89555;
      --cream: #FAF6F0;
      --warm-dark: #2C2420;
      --warm-mid: #5C4D44;
      --white: #FFFFFF;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--white);
      background: linear-gradient(165deg, var(--warm-dark) 0%, var(--burgundy-deep) 35%, var(--burgundy-dark) 65%, var(--burgundy) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 32px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    }

    .page { position: relative; z-index: 1; width: 100%; max-width: 420px; }

    /* ============================================================
       LOGO / BRAND
       ============================================================ */
    .brand {
      text-align: center;
      margin-bottom: 44px;
    }

    .brand-logo {
      width: min(220px, 72vw);
      height: auto;
      margin: 0 auto 0;
      display: block;
    }

    /* fallback wordmark if SVG logo image missing */
    .brand-wordmark {
      font-family: 'Parisienne', 'Brush Script MT', cursive;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      color: var(--cream);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .brand-ribbon {
      display: inline-block;
      background: var(--gold);
      color: var(--warm-dark);
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 6px 20px;
      border-radius: 50px;
      margin-bottom: 16px;
    }

    .brand-tagline {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0.85;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      transition: transform var(--transition), box-shadow var(--transition),
                  background var(--transition), border-color var(--transition);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideIn 0.6s ease forwards;
    }

    .link-btn:nth-child(1) { animation-delay: 0.1s; }
    .link-btn:nth-child(2) { animation-delay: 0.2s; }
    .link-btn:nth-child(3) { animation-delay: 0.3s; }
    .link-btn:nth-child(4) { animation-delay: 0.4s; }
    .link-btn:nth-child(5) { animation-delay: 0.5s; }

    @keyframes fadeSlideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .link-btn:hover,
    .link-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .link-btn:active {
      transform: translateY(0) scale(0.98);
      transition-duration: 0.1s;
    }

    .link-btn .btn-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-btn .btn-label { flex: 1; }

    .link-btn .btn-arrow {
      width: 16px;
      height: 16px;
      opacity: 0.4;
      flex-shrink: 0;
      transition: opacity var(--transition), transform var(--transition);
    }

    .link-btn:hover .btn-arrow {
      opacity: 0.7;
      transform: translateX(2px);
    }

    /* ---- Primary (WhatsApp) ---- */
    .link-btn.primary {
      background: linear-gradient(135deg, var(--burgundy-light) 0%, var(--burgundy) 100%);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 24px rgba(122, 31, 43, 0.4);
      padding: 18px 20px;
      font-size: 1rem;
    }

    .link-btn.primary:hover,
    .link-btn.primary:active {
      box-shadow: 0 8px 36px rgba(37, 211, 102, 0.3), 0 4px 24px rgba(122, 31, 43, 0.4);
      border-color: rgba(37, 211, 102, 0.45);
    }

    .link-btn.primary .btn-label-text {
      display: block;
      font-weight: 700;
      line-height: 1.2;
    }

    .link-btn.primary .btn-discount {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 2px;
    }

    /* ---- Social accent colors ---- */
    .link-btn.instagram:hover { border-color: rgba(225, 48, 108, 0.5); }
    .link-btn.tiktok:hover { border-color: rgba(254, 44, 85, 0.4); }
    .link-btn.location:hover { border-color: rgba(66, 133, 244, 0.4); }
    .link-btn.website:hover { border-color: var(--gold); }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      margin-top: auto;
      padding-top: 56px;
      text-align: center;
    }

    .footer-divider {
      width: 40px;
      height: 1px;
      background: rgba(201, 169, 110, 0.3);
      margin: 0 auto 20px;
    }

    .footer p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.7;
    }

    .footer .footer-address {
      margin-bottom: 6px;
    }

    .footer .footer-tagline {
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(201, 169, 110, 0.45);
      font-size: 0.65rem;
    }
  </style>
</head>

  <!-- ==================== FOOTER ==================== -->
