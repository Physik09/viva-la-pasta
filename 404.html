<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden — Viva la Pasta</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2C2420 0%, #5E1720 50%, #7A1F2B 100%);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: #C9A96E;
      font-style: italic;
      line-height: 1.05;
      margin-bottom: 16px;
    }
    .code { color: #D4BC8A; }
    p { color: rgba(255,255,255,0.75); font-size: 1.05rem; margin-bottom: 8px; line-height: 1.7; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #7A1F2B;
      color: #FFFFFF;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .btn:hover { background: #9A3544; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div>
    <h1>404 <span class="code">—</span> Mamma Mia!</h1>
    <p>Diese Seite haben wir nicht im Angebot.</p>
    <p>Aber unsere Pasta gibt es sehr wohl — jeden Tag frisch.</p>
    <a href="/" class="btn">Zurück zur Startseite</a>
  </div>
</body>
</html>
